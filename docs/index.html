<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MindFoodness</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="container">
    <h1>MindFoodness</h1>
    <p class="subtitle">
      Personalized nutrition guidance based on your current health state.
    </p>

    <form id="healthForm" class="form">
      <div class="field">
        <label>Sleep (hours)</label>
        <input type="number" id="sleep" required />
      </div>

      <div class="field">
        <label>Stress (1 - 10)</label>
        <input type="number" id="stress" min="1" max="10" required />
      </div>

      <div class="field">
        <label>Heart Rate (bpm)</label>
        <input type="number" id="hr" required />
      </div>

      <div class="field">
        <label>Activity Level (1 - 10)</label>
        <input type="number" id="activity" min="1" max="10" required />
      </div>

      <div class="field">
        <label>Energy Level (1 - 10)</label>
        <input type="number" id="energy" min="1" max="10" required />
      </div>

      <button type="submit">Generate Recommendation</button>
    </form>

    <section id="output" class="output"></section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
