<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MindFoodness</title>
  <link rel="stylesheet" href="style.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bubbler+One&family=Funnel+Display:wght@300..800&family=Playwrite+DE+Grund:wght@100..400&display=swap" rel="stylesheet">
  
</head>
<body>
  <main>
    <h1><b>MindFoodness</b></h1>
    <p class="subtitle">Personalized nutrition guidance based on your current health state.</p>

    <form id="healthForm">
      <label>Sleep (hours)</label>
      <input type="number" id="sleep" min="0" step="0.5">

      <label>Stress (1 - 10)</label>
      <input type="number" id="stress" min="1" max="10">

      <label>Heart Rate (bpm)</label>
      <input type="number" id="hr">

      <label>Activity Level (1 - 10)</label>
      <input type="number" id="activity" min="1" max="10">

      <label>Energy Level (1 - 10)</label>
      <input type="number" id="energy" min="1" max="10">

      <button id="submit">Generate Recommendation</button>
    </form>

    <section id="output" type="output" class="output" style="font-family: 'Funnel Display', sans-serif;"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
